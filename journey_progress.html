<style>
  :root {
    --glass: rgba(18, 22, 26, 0.58);
    --etch: rgba(255, 255, 255, 0.22);
    --ink: #ffffff;
    --soft: #d7dde2;
    --fox: #e8893a;
    --track: rgba(255, 255, 255, 0.2);
  }
  html { font-size: calc(100vw / 54); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    position: relative;
    font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
    color: var(--ink);
    text-shadow: 0 0.06rem 0.2rem rgba(0, 0, 0, 0.6);
  }
  .pill {
    position: absolute; left: 2.2rem; right: 2.2rem;
    background: var(--glass);
    border: 0.08rem solid var(--etch);
    border-radius: 2rem;
    display: flex; align-items: center;
    padding: 0 1.3rem;
    box-sizing: border-box;
  }
  .top { height: 2.9rem; gap: 0.8rem; font-size: 1.55rem; font-weight: 600; white-space: nowrap; }
  .day { color: var(--fox); font-weight: 700; flex: none; }
  .sep { width: 0.08rem; height: 1.4rem; background: var(--etch); flex: none; }
  .place { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 0.8rem; color: var(--soft); font-weight: 500; flex: none; }
  .right > span:empty { display: none; }
  .sun { display: flex; align-items: center; gap: 0.4rem; }
  .sun svg { width: 1.9rem; height: 1.9rem; flex: none; }
  .sun b { color: var(--ink); font-weight: 600; }

  .bottom { flex-direction: column; align-items: stretch; padding: 0.55rem 1.4rem 0.7rem; border-radius: 1.4rem; }
  .msg { font-size: 1.45rem; font-weight: 600; color: var(--soft); text-align: center; margin-bottom: 0.35rem;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.6s ease; }
  .msg.fade { opacity: 0; }
  .row { display: flex; align-items: center; gap: 0.9rem; font-size: 1.5rem; font-weight: 500; color: var(--soft); white-space: nowrap; }
  .bar { position: relative; flex: 1; height: 0.6rem; background: var(--track); border-radius: 0.3rem; }
  .fill { position: absolute; inset: 0 auto 0 0; background: var(--fox); border-radius: 0.3rem; }
  .tip { position: absolute; top: 50%; width: 1.3rem; height: 1.3rem; transform: translate(-50%, -50%);
         border-radius: 50%; background: var(--ink); border: 0.22rem solid var(--fox); box-sizing: border-box; }
  .km { color: var(--ink); font-weight: 700; font-size: 1.7rem; }
  .km small { color: var(--soft); font-weight: 500; font-size: 1.4rem; }
  .hidden { display: none !important; }
</style>
</head>
