<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreyFoxJourney overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">

<script>
/* =====================================================================
   MUUDA SIIN  ·  CHANGE HERE
   Salvesta, lae GitHubi üles, oota 1–2 min, vajuta Cloud-OBS-is Refresh.
   ===================================================================== */
var SETTINGS = {

  place: "Sitges, Catalunya",   // koht ülaribal  (tühi "" = peidetud)
  km: 3750,                     // läbitud kilomeetrid kokku
  lat: 41.24,                   // koordinaadid päikese ja temperatuuri jaoks
  lon: 1.81,                    // (Google Maps: vajuta kaardil kohale → numbrid)

  // Vahetuv tekst alumise riba kohal. Iga rida jutumärkides, koma lõpus.
  // Kui ei soovi ühtegi, jäta alles ainult:  messages: [],
  messages: [
    "Hand-engraved glass • commissions open",
    "Estonia → Spain by bike, 5000 km",
    "Support the ride: paypal.me/joosustudio",
  ],
  messageSeconds: 20,           // mitu sekundit üks tekst on ekraanil

  // PayPal QR-kood (viib aadressile paypal.me/joosustudio)
  qrShow: true,                 // false = QR-koodi ei näidata
  qrEveryMinutes: 5,            // kui tihti ilmub (iga 5 min: :00, :05, :10 ...)
  qrShowSeconds: 30,            // mitu sekundit korraga ekraanil
  qrSide: "right",              // "right" = paremal, "left" = vasakul
  qrLabel: "Support the ride",  // tekst QR-koodi kohal


  /* ---------- harvem muudetavad ---------- */
  totalKm: 5000,
  from: "Estonia",
  to: "Spain",
  startDate: "2026-09-25",      // sel kuupäeval oli...
  startDay: 120,                // ...see päev
  timeZone: "Europe/Madrid",
  showTemperature: true,
  showSun: true,                // päikeseloojangu / -tõusu loendur
  topPosition: 3,               // ülariba kaugus ülaservast, % ekraanist
  bottomPosition: 4,            // alariba kaugus alaservast, % (suurem = kõrgemal)

};
/* ===================================================================== */
</script>

<style>
  :root {
    --glass: rgba(18, 22, 26, 0.58);
    --etch: rgba(255, 255, 255, 0.22);
    --ink: #ffffff;
    --soft: #d7dde2;
    --fox: #e8893a;
    --track: rgba(255, 255, 255, 0.2);
  }
  html { font-size: calc(100vw / 54); }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    position: relative;
    font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
    color: var(--ink);
    text-shadow: 0 0.06rem 0.2rem rgba(0, 0, 0, 0.6);
  }
  .pill {
    position: absolute; left: 2.2rem; right: 2.2rem;
    background: var(--glass);
    border: 0.08rem solid var(--etch);
    border-radius: 2rem;
    display: flex; align-items: center;
    padding: 0 1.3rem;
    box-sizing: border-box;
  }
  .top { height: 2.9rem; gap: 0.8rem; font-size: 1.55rem; font-weight: 600; white-space: nowrap; }
  .day { color: var(--fox); font-weight: 700; flex: none; }
  .sep { width: 0.08rem; height: 1.4rem; background: var(--etch); flex: none; }
  .place { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .right { margin-left: auto; display: flex; align-items: center; gap: 0.8rem; color: var(--soft); font-weight: 500; flex: none; }
  .right > span:empty { display: none; }
  .sun { display: flex; align-items: center; gap: 0.4rem; }
  .sun svg { width: 1.9rem; height: 1.9rem; flex: none; }
  .sun b { color: var(--ink); font-weight: 600; }

  .bottom { flex-direction: column; align-items: stretch; padding: 0.55rem 1.4rem 0.7rem; border-radius: 1.4rem; }
  .msg { font-size: 1.45rem; font-weight: 600; color: var(--soft); text-align: center; margin-bottom: 0.35rem;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.6s ease; }
  .msg.fade { opacity: 0; }
  .row { display: flex; align-items: center; gap: 0.9rem; font-size: 1.5rem; font-weight: 500; color: var(--soft); white-space: nowrap; }
  .bar { position: relative; flex: 1; height: 0.6rem; background: var(--track); border-radius: 0.3rem; }
  .fill { position: absolute; inset: 0 auto 0 0; background: var(--fox); border-radius: 0.3rem; }
  .tip { position: absolute; top: 50%; width: 1.3rem; height: 1.3rem; transform: translate(-50%, -50%);
         border-radius: 50%; background: var(--ink); border: 0.22rem solid var(--fox); box-sizing: border-box; }
  .km { color: var(--ink); font-weight: 700; font-size: 1.7rem; }
  .km small { color: var(--soft); font-weight: 500; font-size: 1.4rem; }
  .qr {
    position: absolute; width: 13rem; box-sizing: border-box;
    background: var(--glass); border: 0.08rem solid var(--etch); border-radius: 1.2rem;
    padding: 0.7rem 0.7rem 0.6rem; text-align: center;
    opacity: 0; transform: translateY(1.5rem); transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .qr.show { opacity: 1; transform: none; }
  .qr-label { font-size: 1.5rem; font-weight: 700; color: var(--fox); line-height: 1.1; margin-bottom: 0.45rem; }
  .qr-tile { background: #fff; border-radius: 0.5rem; padding: 0.9rem; line-height: 0; }
  .qr-tile svg { width: 100%; height: auto; display: block; shape-rendering: crispEdges; }
  .qr-link { font-size: 1.2rem; font-weight: 600; color: var(--ink); margin-top: 0.4rem; line-height: 1.1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<script>
(function () {
  var S = SETTINGS;
  var $ = function (id) { return document.getElementById(id); };

  /* positions */
  $("top").style.top = S.topPosition + "%";
  $("bottom").style.bottom = S.bottomPosition + "%";

  /* place */
  if (S.place) { $("place").textContent = S.place; }
  else { $("place").classList.add("hidden"); $("placeSep").classList.add("hidden"); }

  /* km bar */
  function fmt(n) { return Math.round(n).toLocaleString("en-US").replace(/,/g, " "); }
  $("from").textContent = S.from;
  $("to").textContent = S.to;
  $("km").textContent = fmt(S.km);
  $("total").textContent = fmt(S.totalKm);
  var pct = Math.max(0, Math.min(100, S.km / S.totalKm * 100));
  $("fill").style.width = pct + "%";
  $("tip").style.left = pct + "%";

  /* rotating messages */
  var msgs = (S.messages || []).filter(function (m) { return m && String(m).trim(); });
  var mi = 0;
  if (!msgs.length) { $("msg").classList.add("hidden"); }
  else {
    $("msg").textContent = msgs[0];
    if (msgs.length > 1) setInterval(function () {
      $("msg").classList.add("fade");
      setTimeout(function () {
        mi = (mi + 1) % msgs.length;
        $("msg").textContent = msgs[mi];
        $("msg").classList.remove("fade");
      }, 600);
    }, Math.max(5, S.messageSeconds) * 1000);
  }

  /* dates */
  function todayIn(tz) {
    try { return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
    catch (e) { return new Date().toISOString().slice(0, 10); }
  }
  function toUTC(s) { var a = s.split("-").map(Number); return Date.UTC(a[0], a[1] - 1, a[2]); }
  function hhmm(d) {
    try { return new Intl.DateTimeFormat("en-GB", { timeZone: S.timeZone, hour: "2-digit", minute: "2-digit" }).format(d); }
    catch (e) { return d.toTimeString().slice(0, 5); }
  }

  /* sunrise / sunset (standard astronomical formula, no internet needed) */
  var rad = Math.PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, obl = rad * 23.4397, J0 = 0.0009;
  function sunTimes(date, lat, lng) {
    var lw = rad * -lng, phi = rad * lat, d = date.valueOf() / dayMs - 0.5 + J1970 - J2000;
    var n = Math.round(d - J0 - lw / (2 * Math.PI)), ds = J0 + lw / (2 * Math.PI) + n;
    var M = rad * (357.5291 + 0.98560028 * ds);
    var C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
    var L = M + C + rad * 102.9372 + Math.PI, dec = Math.asin(Math.sin(obl) * Math.sin(L));
    var Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    var w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
    var Jset = J2000 + J0 + (w + lw) / (2 * Math.PI) + n + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
    function fromJ(j) { return new Date((j + 0.5 - J1970) * dayMs); }
    return { rise: fromJ(Jnoon - (Jset - Jnoon)), set: fromJ(Jset) };
  }
  function left(ms) {
    var m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60);
    return h ? h + "h " + (m % 60) + "m" : m + "m";
  }
  function updateSun(todayStr) {
    if (!S.showSun || typeof S.lat !== "number" || typeof S.lon !== "number") { $("sun").classList.add("hidden"); return; }
    var now = new Date();
    var t = sunTimes(new Date(toUTC(todayStr) + 12 * 3600000), S.lat, S.lon);
    var target, label, up;
    if (now < t.rise) { target = t.rise; label = "Sunrise"; up = true; }
    else if (now < t.set) { target = t.set; label = "Sunset"; up = false; }
    else { target = sunTimes(new Date(toUTC(todayStr) + 36 * 3600000), S.lat, S.lon).rise; label = "Sunrise"; up = true; }
    $("sunLabel").textContent = label;
    $("sunTime").textContent = hhmm(target);
    $("sunLeft").textContent = left(target - now);
    $("sunArrow").setAttribute("d", up ? "M12 3v6M9 6l3-3 3 3" : "M12 3v6M9 6l3 3 3-3");
  }

  function tick() {
    var today = todayIn(S.timeZone);
    $("dayNum").textContent = S.startDay + Math.round((toUTC(today) - toUTC(S.startDate)) / dayMs);
    $("clock").textContent = hhmm(new Date());
    updateSun(today);
  }

  /* temperature */
  function weather() {
    if (!S.showTemperature || typeof S.lat !== "number" || typeof S.lon !== "number") return;
    fetch("https://api.open-meteo.com/v1/forecast?latitude=" + S.lat + "&longitude=" + S.lon + "&current=temperature_2m")
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.current && typeof d.current.temperature_2m === "number") $("weather").textContent = Math.round(d.current.temperature_2m) + "°C"; })
      .catch(function () {});
  }

  /* PayPal QR: appears on a fixed clock schedule, so a page refresh does not reset it.
     Add ?qrtest=1 to the link to keep it visible while positioning. */
  var qr = $("qr");
  $("qrLabel").textContent = S.qrLabel || "";
  function placeQr() {
    qr.style.bottom = (window.innerHeight * S.bottomPosition / 100 + $("bottom").offsetHeight + window.innerWidth * 0.02) + "px";
    if (S.qrSide === "left") { qr.style.left = "2.2rem"; qr.style.right = "auto"; } else { qr.style.right = "2.2rem"; qr.style.left = "auto"; }
  }
  var qrTest = /[?&]qrtest=1/.test(location.search);
  function updateQr() {
    if (!S.qrShow) { qr.classList.add("hidden"); return; }
    var every = Math.max(1, S.qrEveryMinutes) * 60, secs = Math.floor(Date.now() / 1000);
    qr.classList.toggle("show", qrTest || secs % every < Math.min(S.qrShowSeconds, every));
  }
  placeQr(); updateQr();
  window.addEventListener("resize", placeQr);
  setInterval(placeQr, 5000);
  setInterval(updateQr, 1000);

  tick(); weather();
  setInterval(tick, 15000);
  setInterval(weather, 15 * 60000);
})();
</script>
</body>
